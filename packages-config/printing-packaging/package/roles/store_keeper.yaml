# Role template (Step 6 §9). Tenants copy and change it; it is not hard-coded.
code: store_keeper
name: Store keeper
description: Receives, issues and transfers stock in own stores (scope set per assignment); raises requisitions.
shopFloor: true
permissions:
- profile.*
- foundation.item.read
- manufacturing.job.read
- purchase.requisition.create
- purchase.requisition.read
- purchase.purchase_order.read
- inventory.goods_receipt.*
- inventory.issue.*
- inventory.transfer.*
- inventory.adjustment.create
- inventory.adjustment.read
- inventory.stock.read
- inventory.delivery.*
