# Local development stack (ADR-0060). Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp # local development only
      POSTGRES_DB: erp_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "erp"]
      interval: 5s
      retries: 10

  mailpit: # catches all outgoing e-mail locally
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  minio: # S3-compatible file storage
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp
      MINIO_ROOT_PASSWORD: erp-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
